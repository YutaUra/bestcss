name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: examples のビルド（実環境での統合検証）
        run: |
          pnpm --filter example-vite-react build
          pnpm --filter example-honox-mpa build
          pnpm --filter example-nextjs build
      - name: pack → install 検証（同梱 docs のリンク解決）
        run: node scripts/verify-packed-install.mjs
